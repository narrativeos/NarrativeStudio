name: CI

on:
  push:
    branches: [main]
  pull_request:

# Keep exactly one toolchain install per job; the checks are cheap and ordered
# from fastest-failing to slowest so a broken tree fails in under a minute.
jobs:
  rust:
    name: Rust (fmt / clippy / test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Tauri's Linux system libs are needed to *build* studio-app (the crate is
      # part of the workspace). DuckDB uses its `bundled` feature, so it compiles
      # from source and needs a C++ toolchain.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang cmake pkg-config \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev libssl-dev libxdo-dev librsvg2-dev \
            libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  frontend:
    name: Frontend (typecheck / lint / test / build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: crates/studio-app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  # Packaging is deliberately not a PR gate: compiling DuckDB from source in
  # release mode takes ~20 minutes. Trigger it manually before cutting a release.
  package:
    name: Package (macOS, manual)
    if: github.event_name == 'workflow_dispatch'
    needs: [rust, frontend]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter studio-app exec tauri build
