[package]
name = "studio-app"
description = "NarrativeStudio Tauri application"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
studio-core = { path = "../../studio-core" }
studio-storage = { path = "../../studio-storage" }
studio-import = { path = "../../studio-import" }
studio-analysis = { path = "../../studio-analysis" }
duckdb = { version = "1", features = ["chrono"] }
uuid = { version = "1", features = ["v4"] }