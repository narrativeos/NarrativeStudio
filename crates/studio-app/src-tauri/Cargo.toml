[package]
name = "studio-app"
# 可执行文件名用 NarrativeStudio（进程名 / target/debug 下的二进制名）
default-run = "NarrativeStudio"
description = "NarrativeStudio Tauri application"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "NarrativeStudio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
studio-core = { path = "../../studio-core" }
studio-storage = { path = "../../studio-storage" }
studio-import = { path = "../../studio-import" }
studio-analysis = { path = "../../studio-analysis" }
duckdb = { version = "1", features = ["chrono", "bundled"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
